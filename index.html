<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sol Works</title>
  <link rel="stylesheet" href="style.css?v=20261015f">
</head>
<body>
  <header class="topbar">
    <div class="brand">Sol Works</div>
    <nav class="tabs" role="tablist">
      <button data-tab="home" class="active">대시보드</button>
      <button data-tab="notices">사업공고</button>
      <button data-tab="memo">메모</button>
      <button data-tab="backup">백업</button>
    </nav>
    <div class="sync" id="syncBox">
      <span class="sync-status" id="syncStatus">동기화 준비 중…</span>
      <button type="button" class="ghost sync-btn" id="syncBtn" disabled>로그인</button>
    </div>
    <div class="today-label">
      <div id="weather" class="weather" hidden></div>
      <span id="todayLabel"></span>
    </div>
  </header>

  <main>
    <!-- 대시보드 -->
    <section id="tab-home" class="tab active">
      <div id="loginNudge" class="nudge" hidden>
        <span>로그인하면 할 일·업무·메모·일정이 휴대폰과 PC에서 똑같이 보여요.</span>
        <button type="button" id="nudgeLogin">로그인</button>
        <button type="button" id="nudgeLater" class="ghost">나중에</button>
      </div>
      <form id="askForm" class="ask">
        <span class="ask-mark" aria-hidden="true">✳</span>
        <input id="askInput" autocomplete="off" placeholder="Claude에게 물어보기 (예: 다음 주 화요일 2시 미팅 추가해줘)">
        <button id="askBtn">물어보기</button>
        <button type="button" id="askStop" class="ghost" hidden>중지</button>
      </form>
      <div id="askPanel" class="card ask-panel" hidden>
        <div class="ask-q" id="askQ"></div>
        <div class="ask-a" id="askA"></div>
        <div class="ask-foot"><span class="meta" id="askNote"></span><button type="button" id="askClose" class="ghost">닫기</button></div>
      </div>

      <div class="grid2">
        <div class="card">
          <h2>할 일</h2>
          <form id="homeTodoForm" class="inline-form todo-form">
            <input name="text" placeholder="할 일 추가" required>
            <input name="due" class="ymd" inputmode="numeric" maxlength="10" placeholder="마감 20261015" aria-label="마감일 (예: 20261015)">
            <select name="work" class="work-select" aria-label="연결할 업무"><option value="">업무 없음</option></select>
            <button>추가</button>
          </form>
          <ul id="homeTodo" class="list"></ul>
        </div>
        <div class="card">
          <h2>진행 중인 업무 <small id="workCount"></small></h2>
          <form id="workForm" class="inline-form todo-form">
            <input name="title" placeholder="업무 추가" required>
            <input name="due" class="ymd" inputmode="numeric" maxlength="10" placeholder="마감 20261015" aria-label="마감일 (예: 20261015)">
            <button>추가</button>
          </form>
          <ul id="workList" class="list work-list"></ul>
        </div>
      </div>
      <div class="card">
        <h2>새로 올라온 공고 <small id="homeNewCount"></small></h2>
        <ul id="homeNew" class="list"></ul>
      </div>
      <div class="cal-full">
        <div class="card">
          <div class="cal-head">
            <button id="calPrev" aria-label="이전 달">‹</button>
            <h2 id="calTitle"></h2>
            <button id="calNext" aria-label="다음 달">›</button>
            <button id="calToday" class="ghost">오늘</button>
            <span class="legend">
              <span><i class="dot k-work"></i>업무</span><span><i class="dot k-meeting"></i>회의</span>
              <span><i class="dot k-deadline"></i>마감</span><span><i class="dot k-personal"></i>개인</span>
              <button type="button" id="calAdd" class="add-btn" title="일정 추가"><span aria-hidden="true">+</span> 일정 추가</button>
            </span>
          </div>
          <div class="cal-grid" id="calGrid"></div>
        </div>
      </div>

    </section>

    <!-- 사업공고 -->
    <section id="tab-notices" class="tab">
      <div class="card">
        <div class="kind-toggle" id="nKind" role="tablist" aria-label="공고 구분">
          <button type="button" data-kind="" class="on">전체 <span class="cnt" data-cnt=""></span></button>
          <button type="button" data-kind="지원사업" class="k-support">지원사업 <span class="cnt" data-cnt="지원사업"></span></button>
          <button type="button" data-kind="연구과제" class="k-rnd">연구과제 <span class="cnt" data-cnt="연구과제"></span></button>
        </div>
        <div class="notice-tools">
          <input id="nSearch" placeholder="검색 (제목·기관·분야)">
          <select id="nSource"><option value="">전체 출처</option></select>
          <select id="nRegion">
            <option value="">전체 지역</option>
            <option>서울</option><option>부산</option><option>대구</option><option>인천</option><option>광주</option>
            <option>대전</option><option>울산</option><option>세종</option><option>경기</option><option>강원</option>
            <option>충북</option><option>충남</option><option>전북</option><option>전남</option><option>경북</option>
            <option>경남</option><option>제주</option>
          </select>
          <select id="nFilter">
            <option value="open">접수중·예정</option>
            <option value="all">전체</option>
            <option value="matched">관심 키워드만</option>
            <option value="new">NEW만</option>
            <option value="star">관심공고(★)만</option>
          </select>
          <select id="nSort">
            <option value="new">최신순</option>
            <option value="deadline">마감 임박순</option>
          </select>
        </div>
        <p class="meta" id="nMeta"></p>
        <div id="nList" class="notice-list"></div>
      </div>
    </section>

    <!-- 메모 (포스트잇) -->
    <section id="tab-memo" class="tab">
      <div class="memo-head">
        <h2>메모 <small id="noteCount"></small></h2>
        <input id="noteSearch" class="note-search" type="search" placeholder="메모 검색" aria-label="메모 검색">
        <div class="note-colors" id="newNoteColors" role="radiogroup" aria-label="새 메모 색"></div>
        <button type="button" id="addNote">+ 새 메모</button>
      </div>
      <div id="noteBoard" class="note-board"></div>

    </section>

    <!-- 백업 -->
    <section id="tab-backup" class="tab">
      <div class="card backup">
        <h2>데이터 백업</h2>
        <p class="meta">일정·할 일·업무·메모·관심공고는 이 브라우저에만 저장됩니다. 다른 PC로 옮기려면 내보내기/가져오기를 쓰세요.</p>
        <div class="row">
          <button id="exportBtn">내보내기 (JSON)</button>
          <label class="file-btn">가져오기 <input type="file" id="importFile" accept="application/json" hidden></label>
        </div>
      </div>
    </section>
  </main>


  <dialog id="eventDialog" class="dialog" aria-labelledby="dayTitle">
    <div class="dialog-head">
      <h2 id="dayTitle">일정</h2>
      <button type="button" id="dialogClose" class="icon" aria-label="닫기">×</button>
    </div>
    <ul id="dayEvents" class="list"></ul>
    <h3 id="formTitle">일정 추가</h3>
    <form id="eventForm" class="stack">
      <input type="hidden" name="id">
      <label>제목 <input name="title" required></label>
      <div class="row">
        <label>날짜 <input name="date" class="ymd" inputmode="numeric" maxlength="10" placeholder="20261015" required></label>
        <label>시간 <input name="time" type="time"></label>
      </div>
      <label>분류
        <select name="kind">
          <option value="work">업무</option>
          <option value="meeting">회의</option>
          <option value="deadline">마감</option>
          <option value="personal">개인</option>
        </select>
      </label>
      <label>메모 <textarea name="memo" rows="2"></textarea></label>
      <div class="row">
        <button type="submit">저장</button>
        <button type="button" id="eventDelete" class="danger" hidden>삭제</button>
        <button type="button" id="eventReset" class="ghost">새로 쓰기</button>
      </div>
    </form>
  </dialog>

  <dialog id="loginDialog" class="dialog login-dialog" aria-labelledby="loginTitle">
    <div class="dialog-head">
      <h2 id="loginTitle">로그인</h2>
      <button type="button" id="loginClose" class="icon" aria-label="닫기">×</button>
    </div>
    <form id="loginForm" class="stack">
      <label>아이디 <input name="id" autocomplete="username" required></label>
      <label>비밀번호 <input name="pw" type="password" autocomplete="current-password" minlength="3" required></label>
      <p class="meta login-msg" id="loginMsg"></p>
      <div class="row">
        <button type="submit" id="loginSubmit">로그인</button>
        <button type="button" id="signupBtn" class="ghost">처음이면 계정 만들기</button>
      </div>
    </form>
  </dialog>

  <script src="app.js?v=20261015f"></script>
  <script type="module" src="sync.js?v=20261015f" onerror="window.solSyncFailed && window.solSyncFailed('스크립트를 불러오지 못했어요')"></script>
</body>
</html>
